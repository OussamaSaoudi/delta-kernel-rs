[package]
name = "delta_kernel_ffi"
description = "Provide C FFI bindings for the delta_kernel crate"
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
version.workspace = true
rust-version.workspace = true
build = "build.rs"

# for cargo-release
[package.metadata.release]
release = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tracing = "0.1"
tracing-core = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = [ "json" ] }
url = "2"
delta_kernel = { path = "../kernel", default-features = false, features = [
  "internal-api",
] }
delta_kernel_ffi_macros = { path = "../ffi-proc-macros", version = "0.21.0" }
delta-kernel-unity-catalog = { path = "../delta-kernel-unity-catalog", optional = true }
unity-catalog-delta-client-api = { path = "../unity-catalog-delta-client-api", optional = true }
tokio = { version = "1.47", optional = true, features = ["full"] }
# Phase-2: proto-encoded ResultPlan over FFI (prost runtime for the generated plan-IR types).
prost = { version = "0.13", optional = true }

[build-dependencies]
cbindgen = "0.29.2"
libc = "0.2.175"
# Phase-2: compile proto/*.proto into Rust types (only invoked when the `duckdb` feature is on;
# build.rs gates on CARGO_FEATURE_DUCKDB). Requires `protoc` on PATH.
prost-build = "0.13"

[dev-dependencies]
paste = "1.0"
rand = "0.9.2"
serde = "1.0.219"
serde_json = "1.0.142"
test_utils = { path = "../test-utils", default-features = false }
tokio = { version = "1.47" }
trybuild = "1.0"
tempfile = "3.20.0"
itertools = "0.14.0"
rstest = "0.23"

[features]
default = ["default-engine-rustls", "arrow"]
default-engine-native-tls = ["delta_kernel/default-engine-native-tls", "default-engine-base"]
default-engine-rustls = ["delta_kernel/default-engine-rustls", "default-engine-base"]
delta-kernel-unity-catalog = [ "dep:delta-kernel-unity-catalog", "dep:unity-catalog-delta-client-api" ]
arrow = ["arrow-58"]
arrow-58 = ["delta_kernel/arrow-58"]
arrow-57 = ["delta_kernel/arrow-57"]

# This is an 'internal' feature flag which has all the shared bits from default-engine-native-tls and
# default-engine-rustls. There is a check in kernel/lib.rs to ensure you have enabled one of
# default-engine-native-tls or default-engine-rustls, so default-engine-base will not work by itself
default-engine-base = ["delta_kernel/default-engine-base"]

tracing = [ "tracing-core", "tracing-subscriber" ]
internal-api = []
test-ffi = []

# Phase-1 DuckDB plan-based scan: exposes the `kdf_scan_*` FFI that drives the kernel's
# declarative scan-metadata state machine through the DataFusion engine. Pulls in the
# declarative-plans IR, the default (rustls) engine for IO, and a tokio runtime.
duckdb = [
  "dep:tokio",
  "dep:prost",
  "delta_kernel/declarative-plans",
  "default-engine-rustls",
  "arrow",
]
