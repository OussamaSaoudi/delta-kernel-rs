// Proto mirror of `kernel/src/plans/ir/{plan,nodes}.rs` (the Rust IR is the source of truth).
// This mirrors the `stack/fsr` NodeKind: ListFiles, named-expr Project, MaxByVersion,
// EquiJoin{LeftAnti}, Load{dv_ref}. (Differs from the Spark proto, which mirrors a later IR.)
//
// A plan is a flat list of PlanNodes; each node references upstream nodes by their index in
// `Plan.nodes`. The terminal is named by `ResultPlan.result`. Field numbers are never reused.

syntax = "proto3";

package delta.kernel.plan;

import "expressions.proto";
import "schema.proto";

message FileMeta {
  string location = 1;
  uint64 size = 2;
  int64 last_modified = 3;  // milliseconds since epoch
}

// ============================================================================
// Source operators (0 inputs)
// ============================================================================

message ListFilesNode {
  string start_from = 1;
}

message ScanParquetNode {
  repeated FileMeta files = 1;
  delta.kernel.schema.StructType schema = 2;
  optional delta.kernel.expressions.Predicate predicate = 3;  // push-down hint; may be ignored
}

message ScanJsonNode {
  repeated FileMeta files = 1;
  delta.kernel.schema.StructType schema = 2;
  optional delta.kernel.expressions.Predicate predicate = 3;
}

message ValuesRow {
  repeated delta.kernel.expressions.Scalar values = 1;
}
message ValuesNode {
  delta.kernel.schema.StructType schema = 1;
  repeated ValuesRow rows = 2;
}

// ============================================================================
// Unary operators (1 input)
// ============================================================================

message NamedExpr {
  string name = 1;
  delta.kernel.expressions.Expression expr = 2;
}
message ProjectNode {
  repeated NamedExpr named_exprs = 1;
  delta.kernel.schema.StructType output_schema = 2;
}

message FilterNode {
  delta.kernel.expressions.Predicate predicate = 1;
}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  FILE_TYPE_PARQUET = 1;
  FILE_TYPE_JSON = 2;
}

message LoadColumnInfo {
  delta.kernel.expressions.ColumnName path_column = 1;
  optional delta.kernel.expressions.ColumnName file_size_column = 2;
  optional delta.kernel.expressions.ColumnName num_records_column = 3;
}

enum DvKind {
  DV_KIND_UNSPECIFIED = 0;
  DV_KIND_BYTES = 1;
  DV_KIND_DESCRIPTOR = 2;
}

message DvRef {
  delta.kernel.expressions.ColumnName column = 1;
  DvKind kind = 2;
}

message LoadNode {
  delta.kernel.schema.StructType file_schema = 1;
  FileType file_type = 2;
  optional string base_url = 3;
  repeated delta.kernel.expressions.ColumnName metadata_derived_columns = 4;
  LoadColumnInfo file_meta = 5;
  optional DvRef dv_ref = 6;
}

// "Top 1 per group, ordered by version desc" -- a specialized aggregate.
message MaxByVersionNode {
  repeated delta.kernel.expressions.Expression group_by = 1;
  delta.kernel.expressions.Expression version_column = 2;
  delta.kernel.schema.StructType output_schema = 3;
}

// ============================================================================
// Binary operators (2 inputs, [left, right])
// ============================================================================

enum JoinKind {
  JOIN_KIND_UNSPECIFIED = 0;
  JOIN_KIND_LEFT_ANTI = 1;
}

message EquiJoinNode {
  JoinKind kind = 1;
  repeated delta.kernel.expressions.Expression left_keys = 2;
  repeated delta.kernel.expressions.Expression right_keys = 3;
}

// ============================================================================
// N-ary operators (variable inputs)
// ============================================================================

message UnionAllNode {
  bool ordered = 1;
}

// ============================================================================
// Operator / PlanNode / Plan
// ============================================================================

message Operator {
  oneof op {
    ListFilesNode list_files = 1;
    ScanParquetNode scan_parquet = 2;
    ScanJsonNode scan_json = 3;
    ValuesNode values = 4;
    ProjectNode project = 5;
    FilterNode filter = 6;
    LoadNode load = 7;
    MaxByVersionNode max_by_version = 8;
    EquiJoinNode equi_join = 9;
    UnionAllNode union_all = 10;
  }
}

message PlanNode {
  Operator op = 1;
  // Indices into `Plan.nodes` of this node's upstream inputs (each strictly less than this
  // node's own index, so `nodes` evaluates in order).
  repeated uint32 inputs = 2;
  // SSA name of this node's output (== node index in the kernel IR).
  uint32 output = 3;
}

message Plan {
  repeated PlanNode nodes = 1;
}

// Terminal value for ResultPlan-producing state machines (Scan/FSR).
message ResultPlan {
  Plan plan = 1;
  uint32 result = 2;  // RefId of the terminal node whose rows the engine streams
}
